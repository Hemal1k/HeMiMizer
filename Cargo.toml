[package]
name = "hemimizer"
version = "1.2.0"
edition = "2024"
description = "HeMimizer - gets a freshly installed Windows ready"
authors = ["Richard Hemala"]

[[bin]]
name = "HeMimizer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6.2"
serde_json = "1.0"
rfd = "0.18.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# smaller debug builds (the build folder grew to several GB): line numbers only for the app, nothing for the libraries
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
